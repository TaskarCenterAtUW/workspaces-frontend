name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# Cancel any in-progress run for the same branch/PR when a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Guardrail: a stuck step (e.g. apt during a browser install) fails fast
    # instead of running to GitHub's 6-hour default.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # Runs `nuxt prepare` via the postinstall hook, which generates the .nuxt
      # types + eslint typegen that both `lint` and `typecheck` rely on.
      - name: Install dependencies
        run: npm install

      # The quality steps below use `if: ${{ !cancelled() }}` so every check runs
      # and reports its own result even when an earlier one fails.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # --coverage produces coverage/coverage-final.json (Vitest v8, istanbul
      # shape), later merged with the e2e coverage.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      # Cache the downloaded browser across runs, keyed on the lockfile (so a
      # Playwright version bump invalidates it).
      - name: Cache Playwright browser
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No `--with-deps`: GitHub-hosted ubuntu-latest already ships Chromium's
      # system libraries, so we skip the slow (and here, hanging) apt-get step and
      # only fetch the browser binary. timeout-minutes bounds a stalled download.
      - name: Install Playwright browser
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: npx --no-install playwright install chromium

      # Instrumented e2e run: COVERAGE=true makes nuxt.config.ts load
      # vite-plugin-istanbul, and the e2e fixture writes window.__coverage__ per
      # test to .nyc_output/.
      - name: E2E tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e:coverage

      # Merge unit (Vitest v8) + e2e (istanbul) coverage into one report.
      - name: Combine coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-final.json') != '' }}
        run: npm run coverage:combine

      # Print a per-file coverage table (Stmts/Miss/Cover + TOTAL) to this step's
      # log AND the GitHub run summary UI.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/combined/coverage-summary.json') != '' }}
        run: node scripts/coverage-report.mjs

      # Browsable combined HTML report (open index.html from the artifact).
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/combined/index.html') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/combined/
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
