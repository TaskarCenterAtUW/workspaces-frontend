name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# Cancel any in-progress run for the same branch/PR when a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # Runs `nuxt prepare` via the postinstall hook, which generates the .nuxt
      # types + eslint typegen that both `lint` and `typecheck` rely on.
      - name: Install dependencies
        run: npm install

      # The quality steps below use `if: ${{ !cancelled() }}` so every check runs
      # and reports its own result even when an earlier one fails.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # --coverage produces coverage/coverage-final.json (Vitest v8, istanbul
      # shape), later merged with the e2e coverage.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      - name: Install Playwright browser
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      # Instrumented e2e run: COVERAGE=true makes nuxt.config.ts load
      # vite-plugin-istanbul, and the e2e fixture writes window.__coverage__ per
      # test to .nyc_output/.
      - name: E2E tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e:coverage

      # Merge unit (Vitest v8) + e2e (istanbul) coverage into one report.
      - name: Combine coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-final.json') != '' }}
        run: npm run coverage:combine

      # Surface the combined unit+e2e totals in the GitHub run summary UI.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/combined/coverage-summary.json') != '' }}
        run: |
          node -e '
            const t = require("./coverage/combined/coverage-summary.json").total;
            const rows = ["lines","statements","functions","branches"]
              .map(k => `| ${k[0].toUpperCase()+k.slice(1)} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`)
              .join("\n");
            const md = `## Test coverage — unit + e2e (combined)\n\n| Metric | % | Covered |\n| --- | --- | --- |\n${rows}\n`;
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      # Browsable combined HTML report (open index.html from the artifact).
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/combined/index.html') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/combined/
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
