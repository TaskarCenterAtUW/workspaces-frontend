name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

# Cancel any in-progress run for the same branch/PR when a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # Runs `nuxt prepare` via the postinstall hook, which generates the .nuxt
      # types + eslint typegen that both `lint` and `typecheck` rely on.
      - name: Install dependencies
        run: npm install

      # The quality steps below use `if: ${{ !cancelled() }}` so every check runs
      # and reports its own result even when an earlier one fails.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test:coverage

      # Surface the coverage totals in the GitHub run summary UI (parsed from the
      # json-summary reporter). Covers services/ + util/ — the unit-tested code;
      # pages/components are exercised by the e2e suite, not instrumented here.
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines","statements","functions","branches"]
              .map(k => `| ${k[0].toUpperCase()+k.slice(1)} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`)
              .join("\n");
            const md = `## Unit test coverage — services/ + util/\n\n| Metric | % | Covered |\n| --- | --- | --- |\n${rows}\n`;
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '

      # The browsable HTML report (open index.html from the downloaded artifact).
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Install Playwright browser
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
